# Evaluator executes these commands in order from a fresh checkout.
setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python src/main.py --demo --repo examples/sample_repo --output build/demo-report.md"

test_commands:
  - "python -m unittest discover -s tests -v"

notes: "Python 3.10+. Default mode is deterministic and needs no network, model credentials, or external services. See docs/README.md for optional Claude CLI review and real Git-ref comparison."
